<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中央の攻めの速度：候補手比較</title><style>body{font-family:system-ui;max-width:1280px;margin:20px auto;padding:16px;background:#faf9f6;color:#222}p{line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}svg{width:100%;max-height:600px}button,select{font-size:16px;padding:8px;margin:3px}input{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>
<h1>中央からの反撃：香を足すか、先に銀を交換するか</h1><p><strong>左右とも上側の後手が新米長玉です。</strong>左は実戦で選んだ手、右は別の候補。両方support10＋D10で、深さ11まで完了したMultiPV2の予測手順です。実戦の続きや強制手順ではありません。56手目は２候補限定、46手目は全合法手からの上位２手です。</p>
<select id="choose" aria-label="比較局面" onchange="choose(+this.value)"><option value="0">46手目：△６五銀／△４三銀</option><option value="1" selected>56手目：△５七香打／△５四銀</option></select><p id="note"></p><button onclick="show(0)">開始</button><button onclick="show(1)">候補手</button><button onclick="show(3)">３手先</button><button onclick="show(5)">５手先</button><button onclick="show(9)">９手先</button><button onclick="show(n-1)">←１手</button><button onclick="show(n+1)">１手→</button><input id="seek" aria-label="進める手数" type="range" min="0" oninput="show(+this.value)"><p id="ply"></p><div class="grid" id="panels"></div><script>const cases=/*DATA*/;let c=1,n=1;
/*SVG*/
function show(i){const x=cases[c],max=Math.max(...x.arms.map(a=>a.states.length-1));n=Math.max(0,Math.min(max,i));document.getElementById('seek').max=max;document.getElementById('seek').value=n;document.getElementById('ply').textContent=`開始から${n}手`;document.getElementById('panels').innerHTML=x.arms.map((a,j)=>{const s=a.states[Math.min(n,a.states.length-1)];return `<section><h2>${j?'別の候補':'実戦で選んだ手'}：${a.states[1].move}</h2><p>${s.ply}手目 ${s.move}${n>=a.states.length?'（読み筋終端）':''}</p>${svg(s)}<p>候補評価 ${a.score}cp（後手視点・深さ11）。表示中の局面を再評価した値ではありません。</p><details><summary>予測手順・SFEN</summary><p>${a.states.slice(1).map(t=>`${t.ply}: ${t.move}`).join(' → ')}</p><pre>${s.sfen}</pre></details></section>`}).join('');}
function choose(k){c=k;document.getElementById('choose').value=k;document.getElementById('note').textContent=k===1?'△５四銀を先に指す方が141cp高い結果。ただし後手不利の評価で、ここだけで逆転したとは言えません。右は銀交換後に△５五香打と香を使い、左では△５七香打に▲５八香打と合わせられています。':'今回も△６五銀が第一候補。続きは▲５四歩打に△７六銀で、実戦の△９四歩とは異なります。構想を否定する結果ではありませんが、この分岐自体の優劣はまだ直接比較していません。';show(1);}
document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowLeft')show(n-1);if(e.key==='ArrowRight')show(n+1);});choose(1);</script></html>
