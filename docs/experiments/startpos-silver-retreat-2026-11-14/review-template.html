<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>７五歩を取るか、銀を引くか</title><style>body{font-family:system-ui;max-width:1280px;margin:20px auto;padding:16px;background:#faf9f6;color:#222}p{line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}svg{width:100%;max-height:600px}button,select{font-size:16px;padding:8px;margin:3px}input{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>
<h1>36手目：△７五同銀と△６三銀</h1><p><strong>左右とも上側の後手が新米長玉です。</strong>左は実戦で選んだ手、右は別の候補。両方support10＋D10で、深さ13まで完了したMultiPV2の予測手順です。実戦の続きや強制手順ではありません。35手目▲７五歩打の実戦局面から、この２候補だけを比較しています。</p>
<p>左：実戦の△７五同銀。右：提案の△６三銀。</p><p id="note"></p><button onclick="show(0)">開始</button><button onclick="show(1)">候補手</button><button onclick="show(3)">３手先</button><button onclick="show(5)">５手先</button><button onclick="show(9)">９手先</button><button onclick="show(n-1)">←１手</button><button onclick="show(n+1)">１手→</button><input id="seek" aria-label="進める手数" type="range" min="0" oninput="show(+this.value)"><p id="ply"></p><div class="grid" id="panels"></div><script>const cases=/*DATA*/;let c=0,n=1;
/*SVG*/
function show(i){const x=cases[c],max=Math.max(...x.arms.map(a=>a.states.length-1));n=Math.max(0,Math.min(max,i));document.getElementById('seek').max=max;document.getElementById('seek').value=n;document.getElementById('ply').textContent=`開始から${n}手`;document.getElementById('panels').innerHTML=x.arms.map((a,j)=>{const s=a.states[Math.min(n,a.states.length-1)];return `<section><h2>${j?'別の候補':'実戦で選んだ手'}：${a.states[1].move}</h2><p>${s.ply}手目 ${s.move}${n>=a.states.length?'（読み筋終端）':''}</p>${svg(s)}<p>候補評価 ${a.score}cp（後手視点・深さ13）。表示中の局面を再評価した値ではありません。</p><details><summary>予測手順・SFEN</summary><p>${a.states.slice(1).map(t=>`${t.ply}: ${t.move}`).join(' → ')}</p><pre>${s.sfen}</pre></details></section>`}).join('');}
function choose(k){c=0;document.getElementById('note').textContent='評価は左−48、右−61cp（後手視点）。差は13cpで、今回の浅い探索では大差がありません。右は△６三銀▲７八金△８一飛▲３七桂△５二金と駒組みを続けます。左は桂を渡して８筋から反撃する読み。玉の安全を完全に証明するものではありません。';show(1);}
document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowLeft')show(n-1);if(e.key==='ArrowRight')show(n+1);});choose(0);</script></html>
